# 16384 词表下约 95M 参数。单卡起步值，实际显存/速度需在租用实例测量。
[model]
dim = 768
n_layers = 12
n_heads = 12
n_kv_heads = 4
hidden_dim = 2304
max_seq_len = 1024

[train]
steps = 10000
batch_size = 4
grad_accum = 8
learning_rate = 0.0003
min_lr_ratio = 0.1
warmup_steps = 500
weight_decay = 0.1
grad_clip = 1.0
eval_every = 250
eval_batches = 50
save_every = 250
log_every = 10
seed = 42
cpu_threads = 4
