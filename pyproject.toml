[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windllm"
version = "0.1.0"
description = "从零实现、预训练与微调自己的小型语言模型"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "tokenizers>=0.21,<0.23"]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
cu128 = ["torch==2.8.0"]
data = ["datasets>=3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
windllm = "windllm.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
